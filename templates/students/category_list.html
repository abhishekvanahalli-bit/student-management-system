{% extends 'base.html' %}

{% block content %}
<div class="d-sm-flex align-items-center justify-content-between mb-4 fade-in-up">
    <h1 class="h3 mb-0 text-white text-shadow">Categories</h1>
    <a href="{% url 'category_add' %}" class="d-none d-sm-inline-block btn btn-sm btn-premium shadow-sm"><i
            class="bi bi-plus-lg fa-sm text-white-50"></i> Add Category</a>
</div>

<div class="glass-card mb-4 fade-in-up">
    <div class="card-header bg-transparent border-bottom border-light py-3">
        <h6 class="m-0 font-weight-bold text-primary">All Categories Directory</h6>
    </div>
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-glass" id="dataTable" width="100%" cellspacing="0">
                <thead>
                    <tr>
                        <th width="10%">ID</th>
                        <th width="30%">Name</th>
                        <th width="60%">Description</th>
                    </tr>
                </thead>
                <tbody>
                    {% for category in categories %}
                    <tr>
                        <td class="text-muted small">#{{ category.id }}</td>
                        <td class="font-weight-bold text-dark">{{ category.name }}</td>
                        <td class="text-muted">{{ category.description }}</td>
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="3" class="text-center py-5 text-muted">No categories found.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
