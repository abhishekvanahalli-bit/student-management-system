{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4 text-center">
            <h2 class="mb-3">My Profile</h2>
            <div class="mb-3">
                {% if user.profile.image %}
                    <img src="{{ user.profile.image.url }}" class="profile-img-large mb-3">
                {% else %}
                    <img src="https://ui-avatars.com/api/?name={{ user.username }}" class="profile-img-large mb-3">
                {% endif %}
            </div>
            <h4>{{ user.username }}</h4>
            <p class="text-muted">{{ user.email }}</p>
            {% if user.profile.bio %}
                <p class="mt-3">"{{ user.profile.bio }}"</p>
            {% endif %}
            
            <hr>
            
            <div class="d-flex justify-content-center gap-3">
                <a href="{% url 'settings' %}" class="btn btn-primary"><i class="bi bi-pencil me-2"></i>Edit Profile</a>
                <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary">Back to Dashboard</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
