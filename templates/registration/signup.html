{% extends 'base.html' %}

{% block content %}
<div class="container h-100 fade-in">
    <div class="row justify-content-center align-items-center h-100" style="min-height: 80vh;">
        <div class="col-xl-5 col-lg-6 col-md-8">
            <div class="card o-hidden border-0 shadow-lg my-5 hover-lift">
                <div class="card-body p-0">
                    <div class="row">
                        <div class="col-lg-12">
                            <div class="p-5">
                                <div class="text-center">
                                    <h1 class="h4 text-gray-900 mb-4">Create an Account!</h1>
                                </div>
                                <form class="user" method="post">
                                    {% csrf_token %}
                                    {% for field in form %}
                                        <div class="form-group mb-3">
                                            {{ field }}
                                            {% if field.help_text %}
                                                <small class="form-text text-muted d-block small">{{ field.help_text }}</small>
                                            {% endif %}
                                            {% for error in field.errors %}
                                                <div class="text-danger small">{{ error }}</div>
                                            {% endfor %}
                                        </div>
                                    {% endfor %}
                                    <button type="submit" class="btn btn-primary btn-user btn-block w-100 rounded-pill">
                                        Register Account
                                    </button>
                                </form>
                                <hr>
                                <div class="text-center">
                                    <a class="small" href="{% url 'login' %}">Already have an account? Login!</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    /* Override form styles for signup */
    input {
        border-radius: 50px !important;
        padding: 10px 20px !important;
    }
    .helptext { font-size: 0.8em; color: #858796; }
</style>
{% endblock %}
