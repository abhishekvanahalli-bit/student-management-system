{% extends 'base.html' %}

{% block content %}
<div class="container h-100 d-flex align-items-center justify-content-center min-vh-100 fade-in-up">
    
    <!-- Glass Login Card -->
    <div class="col-xl-4 col-lg-5 col-md-8 col-sm-10">
        <div class="glass-card text-center p-5 position-relative overflow-hidden">
            
            <!-- Logo / Brand -->
            <div class="mb-4">
                <div class="bg-white rounded-circle d-inline-flex align-items-center justify-content-center shadow-lg" style="width: 80px; height: 80px;">
                    <i class="bi bi-gem text-primary fs-1"></i>
                </div>
                <h3 class="mt-3 fw-bold text-white text-shadow">Premium Admin</h3>
                <p class="text-white-50 small">Sign in to continue to your dashboard</p>
            </div>

            <form method="post" class="text-start">
                {% csrf_token %}
                
                <div class="mb-4 position-relative">
                    <label class="form-label text-white-50 small fw-bold text-uppercase">Username</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-end-0 text-white"><i class="bi bi-person"></i></span>
                        <input type="text" name="username" class="form-control form-control-glass ps-2 border-start-0 text-white placeholder-white" placeholder="Enter your ID" required>
                    </div>
                </div>

                <div class="mb-4 position-relative">
                    <label class="form-label text-white-50 small fw-bold text-uppercase">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-end-0 text-white"><i class="bi bi-lock"></i></span>
                        <input type="password" name="password" class="form-control form-control-glass ps-2 border-start-0 text-white placeholder-white" placeholder="••••••••" required>
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="form-check">
                        <input class="form-check-input bg-transparent border-white" type="checkbox" id="rememberMe">
                        <label class="form-check-label text-white-50 small" for="rememberMe">Remember me</label>
                    </div>
                    <a href="#" class="text-white-50 small text-decoration-none hover-white">Forgot Password?</a>
                </div>

                <button type="submit" class="btn btn-premium w-100 py-3 shadow-lg hover-scale">
                    SIGN IN <i class="bi bi-arrow-right ms-2"></i>
                </button>
            </form>

            <div class="mt-4 pt-3 border-top border-white-10">
                <p class="text-white-50 small mb-0">Don't have an account? <a href="{% url 'signup' %}" class="text-white fw-bold text-decoration-none">Sign Up</a></p>
            </div>

            <!-- Background Decoration -->
            <div class="position-absolute top-0 start-0 w-100 h-100 bg-gradient-primary opacity-10 pointer-events-none"></div>
        </div>
    </div>

</div>

<style>
    /* Specific Login Styles */
    .form-control-glass::placeholder { color: rgba(255,255,255,0.5); }
    .hover-white:hover { color: #fff !important; }
    .text-shadow { text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
    .border-white-10 { border-color: rgba(255,255,255,0.1) !important; }
</style>
{% endblock %}
