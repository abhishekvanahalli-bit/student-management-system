            <i class="bi bi-list"></i>
        </button>
        
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="nav navbar-nav ms-auto align-items-center">

                <li class="nav-item me-3">
                    <div class="theme-switch-wrapper">

                            <input type="checkbox" id="checkbox" class="dark-mode-toggle" />
                            <div class="slider round"></div>
                        </label>
                        <i class="bi bi-moon ms-2 text-muted"></i>
                    </div>

                    <a class="nav-link dropdown-toggle d-flex align-items-center" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">

                            <img src="https://ui-avatars.com/api/?name={{ user.username }}" class="rounded-circle me-2" width="35" height="35">

                        <span>{{ user.username }}</span>
